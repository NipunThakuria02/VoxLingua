[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxlingua"
version = "0.1.0"
description = "Local speech analysis and grouped ensemble research pipeline"
requires-python = ">=3.11,<3.13"

[tool.setuptools.packages.find]
where = ["src", "frontend"]

[tool.pytest.ini_options]
pythonpath = ["src", "frontend", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-dir]
voxlingua = "src/voxlingua"
ui = "frontend/ui"

[tool.setuptools.package-data]
ui = ["*.css", "*.html", "assets/*.json", "recorder/*.html", "recorder/*.js"]
