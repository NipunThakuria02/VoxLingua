<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Bebas;src:url('/app/static/fonts/BebasNeue-Regular.ttf');font-weight:400}
@font-face{font-family:Montserrat;src:url('/app/static/fonts/Montserrat.ttf');font-weight:100 900}
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#ededeb;overflow:hidden;font-family:Montserrat,Arial,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%}.scene{height:100vh;position:relative}.hero-copy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;text-align:center;padding:40px 20px 75px}.hero-copy small{font-size:9px;letter-spacing:.3em;color:#b3b3b3;margin:0 0 21px}.hero-copy h1{font-family:Bebas,'Arial Narrow',sans-serif;font-weight:400;font-size:clamp(58px,8vw,114px);line-height:.95;letter-spacing:.025em;margin:0;text-wrap:balance}.hero-copy p{font-size:12px;color:#aaa;max-width:400px;line-height:1.9;margin:22px auto 0}.annotation{position:absolute;bottom:18px;left:22px;font-size:9px;letter-spacing:.12em;color:#888}.region{position:absolute;right:20px;bottom:20px;text-align:right;font-size:10px;color:#b8c6b0;max-width:250px;line-height:1.8}.hint{position:absolute;top:12px;right:16px;color:#666;font:9px monospace;letter-spacing:.1em}
</style></head><body><section class="scene" aria-label="__ARIA__"><canvas id="visual" aria-hidden="true"></canvas>__COPY__<div class="annotation">__CAPTION__</div><div class="region" id="region"></div><div class="hint">__HINT__</div></section><script>
const opts=__OPTIONS__,land=__LAND__;const canvas=document.getElementById('visual'),ctx=canvas.getContext('2d');let W=900,H=550,dpr=1;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,1.7);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize);
const reduced=opts.reduced||matchMedia('(prefers-reduced-motion: reduce)').matches;let visible=true;document.addEventListener('visibilitychange',()=>visible=!document.hidden);
let seed=19;function rand(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}
const rings=Array.from({length:3400},(_,i)=>({a:rand()*Math.PI*2,r:.68+rand()*.32,y:(rand()-.5)*.023,b:.18+rand()*.75,layer:i%3}));
const globe=land.map(([lon,lat])=>{let l=lon*Math.PI/180,p=lat*Math.PI/180;return[Math.cos(p)*Math.sin(l),-Math.sin(p),Math.cos(p)*Math.cos(l),.65+rand()*.35]});
const ocean=Array.from({length:1100},(_,i)=>{let y=1-2*i/1099,r=Math.sqrt(1-y*y),a=i*2.3999632297;return[r*Math.sin(a),y,r*Math.cos(a),.15]});
if(opts.kind==='orbit')document.querySelector('.annotation').style.display='none';
const started=performance.now();let last=0;
function globePoint(p,angle,R,cx,cy){const x=p[0]*Math.cos(angle)+p[2]*Math.sin(angle),z=-p[0]*Math.sin(angle)+p[2]*Math.cos(angle);return[cx+x*R,cy+p[1]*R,z]}
function draw(t){if(!visible)return;ctx.clearRect(0,0,W,H);const seconds=(t-started)/1000,clock=reduced?0:seconds;
if(opts.kind==='orbit'){
 const cx=W*.5,cy=H*.46,rx=Math.min(W*.49,H*.90),ry=Math.min(H*.37,W*.30),tilt=-.24;
 // A complete tilted annulus: both far and near arcs stay visible around the copy.
 for(const p of rings){const a=p.a+clock*(.10+p.layer*.012),rad=.88+(p.r-.68)/.32*.12;
 const x=Math.cos(a)*rad*rx,y=Math.sin(a)*rad*ry,z=Math.sin(a),X=cx+x*Math.cos(tilt)-y*Math.sin(tilt),Y=cy+x*Math.sin(tilt)+y*Math.cos(tilt)+p.y*ry;
 const behindText=Math.abs(X-cx)<W*.36&&Math.abs(Y-H*.40)<105;
 ctx.fillStyle=`rgba(235,239,234,${p.b*(behindText?.12:.86)*(.70+.30*Math.abs(z))})`;ctx.beginPath();ctx.arc(X,Y,.60+(z+1)*.16,0,7);ctx.fill();}
}else if(opts.kind==='globe'){
 const R=Math.min(W*.42,H*.43),cx=W*.5,cy=H*.49;const target=opts.region?-opts.region.lon*Math.PI/180:clock*.065-.5;
 const angle=opts.region?target+(reduced?0:Math.max(0,1-seconds/1.8)*1.1):target;
 if(opts.state==='result'&&!reduced){const scale=.83+.17*Math.max(0,1-seconds/1.2);ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);ctx.translate(-cx,-cy)}
 ctx.strokeStyle='#ffffff0e';for(let k=0;k<5;k++){ctx.beginPath();ctx.ellipse(cx,cy,R*Math.cos(k*.25),R,0,0,7);ctx.stroke()}
 for(const p of ocean.concat(globe)){const [x,y,z]=globePoint(p,angle,R,cx,cy);if(z<.02)continue;ctx.fillStyle=`rgba(235,239,234,${p[3]*(.18+.7*z)})`;ctx.beginPath();ctx.arc(x,y,(.6+.55*z)*(p[3]>.5?1:.5),0,7);ctx.fill()}
 if(opts.state==='processing'){ctx.strokeStyle='#cbd5c58c';ctx.lineWidth=.8;ctx.beginPath();for(let i=0;i<=360;i++){const a=i*Math.PI/180,r=R*(1.045+.015*Math.sin(a*13-clock*3)+.012*Math.sin(a*21+clock*2));const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}
 if(opts.region){const lon=opts.region.lon*Math.PI/180,lat=opts.region.lat*Math.PI/180,p=[Math.cos(lat)*Math.sin(lon),-Math.sin(lat),Math.cos(lat)*Math.cos(lon)];let[x,y,z]=globePoint(p,angle,R,cx,cy);
 if(z>0){const pulse=reduced?12:8+(clock%2)*11;ctx.strokeStyle=`rgba(183,199,177,${reduced?.45:1-(clock%2)/2})`;ctx.beginPath();ctx.arc(x,y,pulse,0,7);ctx.stroke();ctx.fillStyle='#c6d7be';ctx.beginPath();ctx.arc(x,y,3.5,0,7);ctx.fill();ctx.strokeStyle='#c6d7be66';ctx.beginPath();ctx.moveTo(x+8,y);ctx.lineTo(x+32,y-24);ctx.lineTo(x+80,y-24);ctx.stroke()}
 document.getElementById('region').textContent=opts.region.name+' · Representative language region';}
 if(opts.state==='result'&&!reduced)ctx.restore();
}else if(opts.kind==='bars'){
 const cx=W*.5,cy=H*.51,R=Math.min(W*.40,H*.39);let samples=[];
 for(let i=0;i<120;i++){const a=i/120*Math.PI*2,amp=(reduced?10:14+18*Math.sin(i*.7+clock*2)**2+15*Math.sin(i*.21-clock*1.5)**2),x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R*.35;
 samples.push({x,y,a,amp,z:Math.sin(a)})}
 samples.sort((a,b)=>a.z-b.z);for(const p of samples){const alpha=.3+(p.z+1)*.24;ctx.strokeStyle=`rgba(212,225,231,${alpha})`;ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x,p.y-p.amp);ctx.stroke();ctx.strokeStyle=`rgba(170,190,204,${alpha*.1})`;ctx.beginPath();ctx.moveTo(p.x,p.y+3);ctx.lineTo(p.x,p.y+p.amp*.6);ctx.stroke()}
 ctx.fillStyle='#b0b7ba';ctx.textAlign='center';ctx.font='600 16px Montserrat, sans-serif';ctx.fillText(opts.state==='processing'?'ANALYSING LOCALLY':'YOUR SIGNAL, IN FOCUS',cx,cy-8)
}}
function tick(t){if(t-last>32){draw(t);last=t}if(!reduced)requestAnimationFrame(tick)}requestAnimationFrame(tick);if(reduced)addEventListener('resize',()=>draw(performance.now()));
</script></body></html>
